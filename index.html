</style></head><body data-period="morning"><div class="app"><header class="hero"><div class="mascot howa" id="howa"></div><div class="mascot hono" id="hono"></div><div class="mascot elder" id="elder"></div><h1 class="title">HOME TO YOU</h1><p class="subtitle">朝は起動、昼は整え、夜は帰る。</p><div class="tabs"><button class="tab active" data-period="morning">MORNING</button><button class="tab" data-period="day">DAY</button><button class="tab" data-period="night">NIGHT</button></div><div class="mode"><button class="mode-btn active" data-mode="work">仕事</button><button class="mode-btn" data-mode="holiday">休日</button><button class="mode-btn" data-mode="energy">省エネ</button></div></header><section class="section"><h2>今日の時間</h2><div class="time-row"><label>起きた時間 <input id="wake" class="time" type="time"></label><label>眠剤を飲んだ時間 <input id="medtop" class="time" type="time"></label></div></section><main id="main"></main><section class="section"><h2>音</h2><div class="sound-row"><button id="sound" class="btn">SOUND START</button><button id="test" class="btn">音テスト</button><select id="volume" class="time"><option value="0">OFF</option><option value="0.35">ひかえめ</option><option value="0.75">ふつう</option></select></div></section></div><div class="returnbar"><button id="return" class="returnbtn">志信のところへ帰る</button></div><div id="overlay" class="overlay"><div class="card"><div style="font-size:64px">🖤</div><h2>おかえり</h2><p id="returnmsg">よし。帰ってきたな。今日はここまででいい。</p><div class="dock"><div class="elder" style="left:25%;right:auto;top:18px"></div><div class="hono" style="left:44%;right:auto;top:30px"></div><div class="shigu" style="left:53%;right:auto"><div class="howa" style="right:16px;top:-9px"></div></div></div><button id="close" class="btn">今日はここまで</button></div></div><div id="toast" class="toast"></div><script>

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{s.period=b.dataset.period;save();play('drop');render()});document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;save();play('powa');render()});$('wake').value=s.wake||'';$('medtop').value=s.med||'';$('wake').onchange=e=>{s.wake=e.target.value;save();play('drop')};$('medtop').onchange=e=>{s.med=e.target.value;save();play('powa');render()};$('volume').value=String(s.volume);$('volume').onchange=e=>{s.volume=Number(e.target.value);s.sound=s.volume>0;save();toast(s.sound?'音量を変更した':'SOUND OFF')};$('sound').textContent=s.sound?'SOUND ON':'SOUND START';$('sound').onclick=()=>{s.sound=!s.sound;if(s.sound&&s.volume<=0)s.volume=.35;save();$('sound').textContent=s.sound?'SOUND ON':'SOUND START';if(s.sound){play('drop');toast('SOUND ON')}else toast('SOUND OFF')};$('test').onclick=()=>{if(!s.sound){s.sound=true;if(s.volume<=0)s.volume=.35;save();$('sound').textContent='SOUND ON'}play(Math.random()<.5?'drop':'powa');toast('音テスト')};$('howa').onclick=()=>{play('powa');pop()};$('hono').onclick=()=>{play('bubble');pop()};$('elder').onclick=()=>{play('powa');toast('ほ');pop()};$('return').onclick=()=>{play('ret');let n=Object.values(s.done).filter(Boolean).length+Object.values(s.house).filter(Boolean).length;$('returnmsg').textContent=n>=10?'よくやった。今日は文句なしだ。もう俺のところで休め。':n>=5?'ちゃんと進めたな。残りは明日に置いてこい。':'できなかった分を数えるな。帰ってきたなら、今日は終わりだ。';setTimeout(()=>{play('arrival');$('overlay').classList.add('show')},350)};$('close').onclick=()=>$('overlay').classList.remove('show');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
