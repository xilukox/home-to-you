/* v5 — reference-faithful visual pass */
:root{
  --bg:#eef7f6;--bg2:#fbfaf4;--card:rgba(255,255,255,.78);
  --text:#203858;--muted:#7890a3;--line:#c9dde1;
  --accent:#68d4d5;--accent2:#dff4e4;--glow:rgba(104,212,213,.14);
  --dock:rgba(251,253,249,.91);
}
body{
  background:
    radial-gradient(circle at 15% 8%,rgba(255,255,255,.96),transparent 27%),
    radial-gradient(circle at 92% 62%,rgba(231,244,233,.72),transparent 30%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}
body[data-period=day]{
  --bg:#e8f1f3;--bg2:#f7f7f0;--card:rgba(252,253,251,.78);
  --text:#233952;--muted:#7b8d9d;--line:#c8d5d8;
  --accent:#b6e94f;--accent2:#e7f3c3;--glow:rgba(182,233,79,.14);
  --dock:rgba(248,250,246,.92);
}
body[data-period=night]{
  --bg:#10182f;--bg2:#11162b;--card:rgba(17,27,53,.78);
  --text:#f1f3ff;--muted:#abb6cf;--line:#394766;
  --accent:#b7ef47;--accent2:#a7a0ff;--glow:rgba(183,239,71,.12);
  --dock:rgba(15,23,46,.93);
  background:
    radial-gradient(circle at 78% 8%,rgba(168,155,255,.13),transparent 25%),
    radial-gradient(circle at 15% 60%,rgba(106,137,255,.08),transparent 27%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}
.app{max-width:510px;padding:18px 14px 118px}
.card{border:1px solid var(--line);border-radius:21px;box-shadow:0 9px 24px rgba(48,77,99,.075);backdrop-filter:blur(14px)}
body[data-period=night] .card{box-shadow:0 10px 28px rgba(0,0,0,.19),inset 0 0 22px rgba(107,116,255,.025)}
.hero{border:0;background:transparent;box-shadow:none;padding:16px 5px 0;overflow:visible}
.title{
  font-size:clamp(29px,9vw,43px);letter-spacing:.055em;
  font-weight:850;white-space:nowrap;transform:rotate(-.3deg);
  text-shadow:0 1px 0 rgba(255,255,255,.65);
}
body[data-period=night] .title{color:#c8b9ff;text-shadow:0 0 15px rgba(183,165,255,.17)}
.subtitle{display:none}
.hero-critters{right:5px;top:4px;width:72px;height:34px}
.tabs{
  margin-top:19px;gap:0;padding:3px;border:1px solid var(--line);
  border-radius:999px;background:rgba(255,255,255,.43);
  box-shadow:inset 0 1px 8px rgba(55,90,105,.04);
}
body[data-period=night] .tabs{background:rgba(9,17,35,.44)}
.tab{
  border:0;border-radius:999px;padding:11px 5px;background:transparent;
  font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:760
}
.tab.active{
  background:rgba(255,255,255,.60);color:color-mix(in srgb,var(--accent) 76%,#25455f);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent),0 0 17px var(--glow)
}

  background:rgba(20,30,53,.78);color:var(--accent);
}
.section{margin-top:13px;padding:14px 14px 15px;position:relative;overflow:hidden}
.section h2{font-size:16px;letter-spacing:.07em;margin-bottom:4px}
.section h2:before{content:"✦";font-size:12px;margin-right:8px;color:var(--accent)}
.section .note{font-size:11px;letter-spacing:.03em;margin:0 0 10px 22px}
.section:after{
  content:"❧";position:absolute;right:9px;bottom:-5px;
  font-size:42px;color:color-mix(in srgb,var(--accent) 17%,transparent);

}
.time-row{display:grid;gap:7px}

  display:grid;grid-template-columns:1fr 145px;gap:12px;align-items:center;
  font-size:12px;font-weight:700
}
.time{
  min-width:0;width:100%;padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,.24);font-size:12px
}
body[data-period=night] .time{background:rgba(0,0,0,.08)}
.tasks{gap:5px}
.task{
  min-height:45px;padding:7px 10px;border-radius:13px;
  grid-template-columns:27px 25px 1fr auto;gap:8px;
  background:rgba(255,255,255,.13);
  border-color:color-mix(in srgb,var(--line) 84%,transparent);
  box-shadow:none
}
body[data-period=night] .task{background:rgba(255,255,255,.025)}
.check{width:23px;height:23px;border-radius:6px;font-size:12px}
.task-icon{
  font-size:16px;filter:grayscale(.35) saturate(.6);opacity:.78;
}

.name{font-size:13px;letter-spacing:.035em}
.sub{font-size:10px}
.timer-btn{padding:6px 9px;border-radius:10px;font-size:11px}
.style-section{padding:12px 13px 13px}

.mode{margin-top:8px;gap:7px}

}
.style-section h2{margin-bottom:2px}
.style-note{font-size:11px;color:var(--muted);margin:0 0 8px}

.shigu-wrap{
  min-height:92px;
  margin-top:7px;
  padding-left:7px;
  justify-content:flex-start;
  position:relative;
  overflow:visible;
}
.shigu-wrap:before{
  content:"";
  display:none;
  position:absolute;
  left:0;
  bottom:1px;
  width:96px;
  height:72px;
  border-radius:28px;
  pointer-events:none;
}

  display:block;
  background:linear-gradient(180deg,rgba(37,54,67,.88),rgba(43,57,63,.84));

  box-shadow:0 5px 12px rgba(48,71,80,.12);
}

  display:block;
  background:linear-gradient(180deg,rgba(32,43,61,.91),rgba(40,48,58,.88));
  border:1px solid rgba(255,255,255,.20);
  box-shadow:0 5px 13px rgba(45,61,77,.13);
}

.shigu-btn{
  flex:0 0 auto;
  position:relative;
  z-index:1;
}
.shigu-img{
  width:80px;
  height:auto;
  max-width:none;
  display:block;
  object-fit:contain;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.13));
}

  filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));
}
.return-bar{
  max-width:480px;padding:5px;border-radius:19px;
  border-color:color-mix(in srgb,var(--accent) 35%,var(--line));
  background:var(--dock);box-shadow:0 8px 25px rgba(28,47,62,.16)
}
.return-btn{
  border-radius:15px;padding:15px 18px;font-size:15px;letter-spacing:.05em;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent2) 78%,white),color-mix(in srgb,var(--accent) 72%,white));
  color:#244257;position:relative
}
.return-btn:after{content:"⌂";position:absolute;right:17px;font-size:20px}
body[data-period=night] .return-btn{
  background:linear-gradient(90deg,#baf531,#d8f36b);
  color:#18231d;box-shadow:0 0 23px rgba(183,239,71,.23)
}
.sound-row{gap:7px}
.sound-btn{padding:8px 10px;font-size:11px;border-radius:10px}
section.card.section:last-of-type{opacity:.74}
body[data-period=night] .section:before{
  content:"✦  ·  ✧";position:absolute;right:18px;top:12px;
  font-size:10px;letter-spacing:8px;color:rgba(185,190,255,.22)
}
@media(max-width:390px){
  .title{font-size:29px}
  .hero-critters{width:62px;height:28px}

document.addEventListener('click',e=>{
  if(e.target && e.target.id==='morningStart'){
    const ok=confirm('今日のチェックを新しくする？ 過去の記録は消えないぞ。※今日のチェックはリセットされる。');
    if(ok) startToday();
  }
});


// Persistent history and calendar. Existing day keys are preserved.
const DAY_TASK_LABELS=Object.fromEntries(Object.values(TASKS).flat().map(t=>[t[0],t[1]]));
const historyNow=new Date(); let historyYear=historyNow.getFullYear(), historyMonth=historyNow.getMonth(), historySelected=getDateKey();
function historyKeys(){return Object.keys(localStorage).filter(k=>/^homeToYou:\d{4}-\d{2}-\d{2}$/.test(k));}
function readHistory(key){try{return JSON.parse(localStorage.getItem('homeToYou:'+key)||'null')}catch(e){return null}}
function htmlEscape(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function historyStats(keys){let done=0,active=0;keys.forEach(k=>{let v=readHistory(k);if(!v)return;let n=Object.values(v.done||{}).filter(Boolean).length+Object.values(v.house||{}).filter(Boolean).length;done+=n;if(n>0)active++});return {done,active}}
function showHistoryDetail(key){historySelected=key;let rec=readHistory(key);const el=$('historyDetail');if(!el)return;const names=rec?[...Object.entries(rec.done||{}).filter(([,v])=>v).map(([k])=>DAY_TASK_LABELS[k]||k),...Object.entries(rec.house||{}).filter(([,v])=>v).map(([k])=>'家事：'+k)]:[];
const txt=rec?`<strong>${htmlEscape(key)} の記録</strong><div>できたこと：${names.length}個</div><div>${names.length?names.map(htmlEscape).join(' ・ '):'チェックがない日も、ちゃんと一日だぞ。'}</div><div>起床：${htmlEscape(rec.wakeTime||'—')} ／ 眠剤：${htmlEscape(rec.medTime||'—')}</div>${rec.memo?`<div class="detail-memo">✎ ${htmlEscape(rec.memo)}</div>`:''}`:`<strong>${htmlEscape(key)}</strong><div>まだ記録がない日だぞ。</div>`;el.innerHTML=txt;renderHistoryCalendar(false)}
function renderHistoryCalendar(updateDetail=true){const grid=$('historyCalendar');if(!grid)return;let first=new Date(historyYear,historyMonth,1),days=new Date(historyYear,historyMonth+1,0).getDate();$('historyMonth').textContent=historyYear+'年'+(historyMonth+1)+'月';let content='';for(let i=0;i<first.getDay();i++)content+='<span></span>';
for(let d=1;d<=days;d++){const k=`${historyYear}-${String(historyMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let r=readHistory(k);content+=`<button type="button" class="history-day ${r?'has-record ':''}${k===getDateKey()?'today ':''}${k===historySelected?'selected':''}" data-history-day="${k}" aria-label="${k}"><span>${d}</span><span class="history-dot"></span></button>`}grid.innerHTML=content;
grid.querySelectorAll('[data-history-day]').forEach(b=>b.onclick=()=>showHistoryDetail(b.dataset.historyDay));const prefix=`${historyYear}-${String(historyMonth+1).padStart(2,'0')}-`;const ks=historyKeys().map(k=>k.slice('homeToYou:'.length)).filter(k=>k.startsWith(prefix));let monthly=historyStats(ks);let week=[];for(let i=6;i>=0;i--){let dt=new Date();dt.setHours(12,0,0,0);dt.setDate(dt.getDate()-i);week.push(getDateKey(dt))}let weekly=historyStats(week);$('historySummary').innerHTML=`<strong>ふりかえり</strong><div>この月：チェック ${monthly.done} 個 ／ できた日 ${monthly.active} 日</div><div>最近7日：チェック ${weekly.done} 個 ／ できた日 ${weekly.active} 日</div><div>数字は競争じゃない。積み重ねを見つけるためのものだぞ。</div>`;if(updateDetail)showHistoryDetail(historySelected)}
$('historyPrev').onclick=()=>{historyMonth--;if(historyMonth<0){historyYear--;historyMonth=11}renderHistoryCalendar()};
$('historyNext').onclick=()=>{historyMonth++;if(historyMonth>11){historyYear++;historyMonth=0}renderHistoryCalendar()};
$('dayMemo').value=state.memo||'';
function storeMemo(){state.memo=$('dayMemo').value;save();renderHistoryCalendar();toast('今日のひとこと、保存したぞ')}
$('memoSave').onclick=storeMemo;$('dayMemo').addEventListener('change',storeMemo);
$('historyExport').onclick=()=>{const data={app:'HOME TO YOU',formatVersion:1,exportedAt:new Date().toISOString(),records:{}};historyKeys().forEach(k=>data.records[k]=readHistory(k.slice(11)));const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='HOME_TO_YOU_記録_'+getDateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('historyImport').onclick=()=>$('historyImportFile').click();
$('historyImportFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='HOME TO YOU'||!data.records||typeof data.records!=='object')throw Error('形式が違う');const entries=Object.entries(data.records).filter(([k,v])=>/^homeToYou:\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==='object');if(!entries.length)throw Error('記録が見つからない');if(!confirm(entries.length+'日分のバックアップを読み込む？ 同じ日付の記録は上書きされるぞ。'))return;for(const [k,v] of entries)localStorage.setItem(k,JSON.stringify(v));location.reload()}catch(err){alert('読み込めなかった：'+err.message)}finally{e.target.value=''}};
// Soft musical feedback: Web Audio makes sound without needing extra files.
let bellAudioContext;
function gentleBell(notes=[880,1320]){if(!state.sound||state.volume<=0)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;bellAudioContext=bellAudioContext||new C();bellAudioContext.resume();const t=bellAudioContext.currentTime;notes.forEach((hz,i)=>{let osc=bellAudioContext.createOscillator(),gain=bellAudioContext.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(0,t+i*.16);gain.gain.linearRampToValueAtTime(Math.min(.13,state.volume*.13),t+i*.16+.018);gain.gain.exponentialRampToValueAtTime(.001,t+i*.16+.85);osc.connect(gain).connect(bellAudioContext.destination);osc.start(t+i*.16);osc.stop(t+i*.16+.9)})}catch(e){}}
$('bellTest').onclick=()=>{if(!state.sound){state.sound=true;if(state.volume<=0)state.volume=.35;save();$('soundToggle').textContent='SOUND ON'}gentleBell([880,1175,1568]);toast('ちりん♪')};
// Bells accompany starting a day and the bedtime task; existing sound variety remains.
document.addEventListener('click',e=>{if(e.target?.id==='morningStart'&&state.sound)gentleBell([784,1047]);if(e.target?.closest?.('[data-task="bedReady"]'))setTimeout(()=>gentleBell([784,587]),20)},true);
renderHistoryCalendar();

render(); if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
